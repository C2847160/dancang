name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint · Format · Type · Test · Deps
    runs-on: ubuntu-latest

    # CI has no use for local git hooks — skip the `prepare` script
    # (which runs `husky`) during install.
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # ubuntu-latest runner now ships Node 24 (Node 20 deprecated Sept 2025).
      # Pin explicitly so the CI env matches local dev (also Node 24).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (tsc -b Project References)
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test

      # typecheck only emits declarations; the bundler is never exercised
      # anywhere else, so a broken Vite build has to fail here.
      - name: Build (vite)
        run: pnpm build

      - name: Dependency boundaries (dependency-cruiser)
        run: pnpm check:deps
