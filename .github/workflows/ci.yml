name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint · Format · Type · Test · Deps
    runs-on: ubuntu-latest

    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # Ubuntu-latest now ships Node 24 runners (Node 20 deprecated Sept 2025).
      # Pin 24 explicitly so there's no silent forced-upgrade ambiguity.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint 2>&1 | tee lint.log
      - name: Show lint log (last 50 lines)
        if: failure()
        run: tail -50 lint.log

      - name: Type-check (tsc -b Project References)
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test

      - name: Dependency boundaries (dependency-cruiser)
        run: pnpm check:deps
