name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint · Format · Type · Test · Deps
    runs-on: ubuntu-latest

    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (tsc -b Project References)
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test

      # Split depcruise into apps-only and packages-only to isolate
      # what triggers the Linux-runner-only exit 1 we see on every run.
      - name: Dependency boundaries — apps/ only
        run: |
          set -o pipefail
          pnpm depcruise apps --output-type text 2>&1 | tee depcruise-apps.log
      - name: Dependency boundaries — packages/ only
        run: |
          set -o pipefail
          pnpm depcruise packages --output-type text 2>&1 | tee depcruise-pkgs.log
      - name: Dependency boundaries — full (apps + packages)
        run: |
          set -o pipefail
          pnpm depcruise apps packages --output-type text 2>&1 | tee depcruise-full.log
