name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint · Format · Type · Test · Deps
    runs-on: ubuntu-latest

    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (tsc -b Project References)
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test

      # Isolating which directory triggers depcruise's Linux-only exit 1.
      - name: depcruise apps/web
        run: pnpm depcruise apps/web
      - name: depcruise apps/server
        run: pnpm depcruise apps/server
      - name: depcruise packages
        run: pnpm depcruise packages
      - name: depcruise full (apps + packages)
        run: pnpm depcruise apps packages
