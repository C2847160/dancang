# Netlify deployment for the frontend only (see README §7).
# Kept alongside vercel.json: on some networks the entire *.vercel.app zone is
# DNS-polluted, while *.netlify.app resolves normally, so this is a one-import
# fallback that needs no network changes.

[build]
  command = "pnpm --filter @repo/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  # `pnpm install` triggers the root `prepare: husky` script. Netlify is not a
  # developer machine, so skip hook installation (same as the GitHub Actions
  # workflow). The pnpm version itself is taken from `packageManager` in the
  # root package.json via Corepack — Netlify has no PNPM_VERSION variable.
  HUSKY = "0"

# SPA fallback: unknown paths serve index.html so a hard refresh works.
# Netlify serves existing files first, so /assets/* is unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite inlines VITE_* variables at build time, so a change requires a redeploy.
# Set VITE_API_BASE_URL in Site configuration → Environment variables to point
# at a real backend; leave it unset to use the built-in demo dataset.
